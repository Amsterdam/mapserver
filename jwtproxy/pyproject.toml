[project]
name = "jwtproxy"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.5",
    "aiosignal==1.4.0",
    "async-timeout==5.0.1",
    "attrs==26.1.0",
    "azure-monitor-opentelemetry==1.8.12",
    "cffi>=2.1.1",
    "charset-normalizer==3.5.2",
    "cryptography==50.0.2",
    "frozenlist==1.8.0",
    "idna==3.20",
    "jwcrypto==1.6.1",
    "multidict==7.2.1",
    "pycparser==3.12",
    "yarl===1.25.1",
]

[dependency-groups]
dev = [
    "aiohttp-devtools==1.1.2",
    "aiointercept==1.0.0",
    "anyio==4.14.2",
    "asttokens==2.4.1",
    "ruff==0.17.5",
    "click==8.5.1",
    "devtools==0.13.0",
    "executing==2.3.0",
    "pre-commit==4.7.0",
    "Pygments==2.21.0",
    "pytest==9.2.0",
    "pytest-aiohttp==1.1.1",
    "six==1.17.0",
    "sniffio==1.3.1",
    "yarl==1.25.1",
    "supervisor",
]

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
asyncio_mode = "auto"
testpaths = ["tests"]

# ==== ruff ====
[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "B", # flake8-bugbear
    "C90", # mccabe
    "BLE", # flake8-blind-except
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "DJ", # flake8-django
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "PGH", # pygrep-hooks
    "RET", # flake8-return (partially)
    # "PT",  # flake8-pytest-style
    # "TCH",  # flake8-type-checking (moves import to `if typing.TYPE_CHECKING`)
    # "ERA",  # eradicate (commented out code)
    # "TRY",  # tryceratops
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "INT", # flake8-gettext
    "FLY", # flynt (fixes unneeded static string joins)
    "UP", # pyupgrade
    "S", # security (bugbear)
    "RUF010", # ruff: fix f"{str(..)}" usage
    "RUF013", # ruff: fix annotations for =None arguments
]
ignore = [
    "S311", # allow random.randint()
    "DJ001", # allow models.CharField(null=True)
    "SIM105", # enforcing contextlib.suppress() instead of try..catch
    "RET501", # unnecessary-return-none
    "RET505", # superfluous-else-return
    "RET505", # superfluous-else-return
    "RET506", # superfluous-else-raise
    "RET507", # superfluous-else-continue
    "RET508", # superfluous-else-break
    "S607", # subprocess partial path
]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-gettext]
extend-function-names = ["gettext_lazy", "ngettext_lazy", "pgettext", "pgettext_lazy", "npgettext", "npgettext_lazy"]

[tool.ruff.lint.isort]
known-first-party = ["tests"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["DJ008", "S101", "S105", "S106", "S314", "S320", "S608"]  # allow asserts, hardcoded passwords, lxml parsing, SQL injection
