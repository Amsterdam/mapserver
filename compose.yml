# This file is only for local development purposes. The actual deployment
# configuration lives in a separate repository.
services:
  database:
    build:
      context: .
      dockerfile: Dockerfile.database
    ports:
      - "5403:5432"
    environment:
      - POSTGRES_PASSWORD=insecure
      - POSTGRES_DB=postgres

    command: ["postgres", "-c", "log_statement=all"]
    volumes:
      - "${POSTGRES_DATA_DIR:-/var/lib/postgresql/data}:/var/lib/postgresql/data"

  proxy:
    build:
      context: jwtproxy
      dockerfile: Dockerfile.dev
    ports:
      - 9191:8000
    environment:
      PROXY_URL: http://map
      JWKS_PATH: /app/test_jwk.json
      LOG_LEVEL: DEBUG
      #JWKS_URL: "https://iam.amsterdam.nl/auth/realms/datapunt-ad-acc/protocol/openid-connect/certs"

  # Bare bones 'webserver' to behave as public loadbalancer
  publicdummy:
    image: python:3.13-slim-bullseye
    ports:
      - 8000:8000
    command: python3 -m http.server 8000

  public:
    build:
      context: .
      # The Dockerfiles bake the advertised WMS address into the mapfiles at
      # build time (MAP_URL_REPLACE). Rebuild after changing a port.
      args:
        EXTRA_ARG1: http://localhost:8383
        EXTRA_ARG2: http://localhost:8383
    image: mapserver/public
    ports:
      - "8383:8080"
    environment:
      # Used by apache to allow complete access for local dev
      LOCAL: "true"

      PANORAMA_DB_NAME: panorama
      PANORAMA_DB_USER: postgres
      PANORAMA_DB_PASSWORD: insecure
      PANORAMA_DB_HOST: database

      DATASERVICES_DB_NAME: postgres
      DATASERVICES_DB_USER: postgres
      DATASERVICES_DB_PASSWORD: insecure
      DATASERVICES_DB_HOST: database

  private:
    build:
      context: .
      dockerfile: Dockerfile.private
      args:
        BASE_IMAGE: mapserver/public
        EXTRA_ARG1: http://localhost:8384
        EXTRA_ARG2: http://localhost:8384
    depends_on:
    - public
    ports:
      - "8384:8080"
    environment:
      # Used by apache to allow complete access for local dev
      LOCAL: "true"

      PANORAMA_DB_NAME: panorama
      PANORAMA_DB_USER: postgres
      PANORAMA_DB_PASSWORD: insecure
      PANORAMA_DB_HOST: database

      DATASERVICES_DB_NAME: postgres
      DATASERVICES_DB_USER: postgres
      DATASERVICES_DB_PASSWORD: insecure
      DATASERVICES_DB_HOST: database

  topografie:
    build:
      context: .
      dockerfile: Dockerfile.topografie
      args:
        BASE_IMAGE: mapserver/public
        EXTRA_ARG1: http://localhost:8385
        EXTRA_ARG2: http://localhost:8385
    depends_on:
    - public
    ports:
      - "8385:8080"
    environment:
      # Used by apache to allow complete access for local dev
      LOCAL: "true"

      PANORAMA_DB_NAME: panorama
      PANORAMA_DB_USER: postgres
      PANORAMA_DB_PASSWORD: insecure
      PANORAMA_DB_HOST: database

      DATASERVICES_DB_NAME: postgres
      DATASERVICES_DB_USER: postgres
      DATASERVICES_DB_PASSWORD: insecure
      DATASERVICES_DB_HOST: database
